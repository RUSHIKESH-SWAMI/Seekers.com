{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <!-- Page Header -->
        <div class="mb-4 text-center">
            <h3 class="fw-bold">Edit Profile</h3>
            <p class="text-muted">
                Update your skills and upload your resume
            </p>
        </div>

        <!-- Profile Form -->
        <div class="card shadow-sm">
            <div class="card-body">

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Skills -->
                    <div class="mb-3">
                        <label for="skills" class="form-label">Skills (comma separated)</label>
                        <textarea name="skills" id="skills" class="form-control" rows="3">{{ profile.skills }}</textarea>
                    </div>

                    <!-- Resume -->
                    <div class="mb-3">
                        <label for="resume" class="form-label">Resume (PDF)</label>
                        <input type="file" name="resume" id="resume" class="form-control">
                    </div>

                    {% if profile.resume %}
                        <div class="mb-3">
                            <strong>Current Resume:</strong>
                            <a href="{{ profile.resume.url }}" target="_blank">View</a>
                        </div>
                    {% endif %}

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
