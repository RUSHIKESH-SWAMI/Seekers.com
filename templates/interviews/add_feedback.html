{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="fw-bold mb-4">Add Interview Feedback</h3>
                
                <div class="mb-3">
                    <strong>Student:</strong> {{ interview.student.username }}<br>
                    <strong>Date & Time:</strong> {{ interview.scheduled_at }}<br>
                    <strong>Status:</strong> {{ interview.status }}
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="feedback" class="form-label">Interview Feedback</label>
                        <textarea name="feedback" id="feedback" class="form-control" rows="5" 
                                  placeholder="Provide detailed feedback about the student's performance..." required></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'my_interviews' %}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-success">Complete Interview</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
